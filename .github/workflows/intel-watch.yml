name: intel-watch
# 觸發 ② 的第 1 層（第 14.4 節）：每小時以純程式比對公告與已存的 daily 圖譜，命中才派發 sentinel.yml（scenario=advisory）。
# 公告來源：repo 內手寫的公告，以及 CISA KEV 新列入、經 NVD 查到涉及我們技術棧產品的 CVE（程式自動產生）。
# 不使用 LLM、不需要 ANTHROPIC_API_KEY。
on:
  schedule:
    - cron: "17 * * * *"           # 每小時一次，避開整點
  workflow_dispatch:

permissions:
  contents: write                  # 比對／派工狀態內容改變時發布 intel-watch.json
  actions: write                   # 觸發 sentinel.yml

concurrency:
  group: intel-watch-state
  cancel-in-progress: false
  queue: max                      # 最多 100 個 pending；預設 single 會取代等待中的公告調查

env:
  PYTHONIOENCODING: utf-8

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15               # NVD 沒有 API key 時每 30 秒 5 次，每次最多查 20 個 CVE
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - name: 第 1 層比對；先由 CISA KEV 近 30 天新列入的 CVE 查 NVD 產生公告（命中只排入 queued）
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}       # 選用；沒有時放慢查詢速度
        run: python agents/tools/intel_watch.py --refresh-kev --defer-dispatch
      - name: 語意狀態改變時才發布 intel-watch.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-intel-watch.sh
      # 自動公告只存在 intel-watch.json；被派工的 sentinel.yml 會 checkout 派工當下的 main，所以先發布、再派工
      - name: 派工 queued 的命中（派工參數以陣列傳入，不拼接 shell 指令）
        env:
          GH_TOKEN: ${{ github.token }}
          ADVISORY_EXECUTION_MODE: ${{ vars.SENTINEL_SCHEDULE_MODE || 'replay' }}
        run: python agents/tools/intel_watch.py --dispatch-queued
      - name: 發布派工結果
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-intel-watch.sh
