name: sentinel
# Agent 流程（觸發 ② 公告、③ 每日）：Orchestrator → A0 → A1/A2/A3 → A4 → A5 報告與建議（第 14.3 節）
# 系統只讀、只建議：不開 PR、不寫 Repo ①。只有 a5-report 有 contents: write，且只透過 push-with-retry.sh 發布。
run-name: sentinel/${{ inputs.request_id || github.run_id }}/${{ inputs.scenario || 'daily' }}

on:
  schedule:
    - cron: "0 0 * * *"            # 台灣時間 08:00；GitHub 排程可能延遲
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        default: daily
        options: [daily, intel-demo, peer-incident, early-signal, php2shell, nas, insider-path, mobile-sdk, advisory]
      trigger_source:
        type: choice
        default: manual
        options: [manual, web, intel-watch]
      assets:
        description: "事件觸發時的受影響資產（逗號分隔），由 intel-watch 帶入"
        required: false
      advisory_id:
        required: false
      advisory_revision:
        required: false
      target_sha:
        description: "intel-watch 固定的來源 SHA；其他情況由 Orchestrator 解析 default branch"
        required: false
      request_id:
        description: "伺服器產生並驗證的請求 ID，供 status API 關聯"
        required: false
      execution_mode:
        type: choice
        default: replay
        options: [replay, live]

concurrency:
  group: sentinel
  cancel-in-progress: false
  queue: max                      # 最多 100 個 pending；預設 single 會取代等待中的公告調查

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  TARGET_REPO: ${{ vars.TARGET_REPO || format('{0}/shopsaas-demo-platform', github.repository_owner) }}
  DEPLOYMENTS_FILE: gh/deployments.json   # A0 Job 由 GitHub API 讀取；缺少時 Agent 改用離線 fixture 並在報告標示

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      daily_intel: ${{ steps.plan.outputs.daily_intel }}
      as_of: ${{ steps.plan.outputs.as_of }}
      output_dir: ${{ steps.plan.outputs.output_dir }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      execution_mode: ${{ steps.plan.outputs.execution_mode }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ inputs.target_sha || '' }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          ASSETS: ${{ inputs.assets }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          ADVISORY_REVISION: ${{ inputs.advisory_revision }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          EXECUTION_MODE: ${{ inputs.execution_mode || vars.SENTINEL_SCHEDULE_MODE || 'replay' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_DIR: target
        run: |
          TARGET_SHA="$(git -C target rev-parse HEAD)"
          if [[ -n "$INPUT_TARGET_SHA" && "$INPUT_TARGET_SHA" != "$TARGET_SHA" ]]; then echo "target_sha 不一致" >&2; exit 1; fi
          export TARGET_SHA
          python agents/run_agent.py orchestrator
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "${{ github.run_id }}-orchestrator", path: out/, if-no-files-found: ignore, include-hidden-files: true }

  a0-assets:
    needs: [orchestrator]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - name: 讀取 Repo ① 的 GitHub Deployments（唯讀；失敗不中斷）
        env:
          GH_READ_TOKEN: ${{ secrets.TARGET_READ_TOKEN }}
        run: python scripts/fetch-deployments.py "$DEPLOYMENTS_FILE"
      - env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: ${{ needs.orchestrator.outputs.execution_mode }}
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          ASSETS: ${{ inputs.assets }}
          TARGET_DIR: target
        run: python agents/run_agent.py a0
      - uses: actions/upload-artifact@v4
        with: { name: "${{ github.run_id }}-a0", path: out/, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: "${{ github.run_id }}-deployments", path: gh/deployments.json, if-no-files-found: error }

  scanners:
    needs: [orchestrator, a0-assets]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' && fromJSON(needs.orchestrator.outputs.plan || '{}').scanners == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # kev／nvd 是輔助資料（CISA KEV 全集、NVD 依 CPE 查執行環境與設備的 CVE）：失敗時報告註明涵蓋不足，不讓整個流程顯示失敗
    continue-on-error: ${{ matrix.tool == 'kev' || matrix.tool == 'nvd' }}
    strategy:
      fail-fast: false
      matrix:
        tool: [trivy, gitleaks, checkov, kev, nvd]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - name: 執行掃描工具（只解析檔案，不安裝或執行 Repo ① 的套件與腳本）
        env:
          TOOL: ${{ matrix.tool }}
          NVD_API_KEY: ${{ matrix.tool == 'nvd' && secrets.NVD_API_KEY || '' }}   # 選用；沒有時放慢查詢速度
        run: |
          mkdir -p raw
          case "$TOOL" in
            trivy)
              for svc in storefront member-api; do
                docker run --rm -v "$PWD/target/services/$svc:/scan:ro" aquasec/trivy:0.57.1 \
                  fs --scanners vuln --format json --quiet /scan > "raw/trivy-$svc.json"
              done
              docker run --rm aquasec/trivy:0.57.1 version --format json > raw/trivy-version.json ;;
            gitleaks)
              docker run --rm -v "$PWD/target:/repo:ro" -v "$PWD/raw:/out" -v "$PWD/.gitleaks.toml:/cfg/gitleaks.toml:ro" \
                zricethezav/gitleaks:v8.21.2 detect --source /repo --config /cfg/gitleaks.toml --redact \
                --report-format json --report-path /out/gitleaks.json --exit-code 0 --no-banner ;;
            checkov)
              pip install --quiet checkov==3.2.0
              checkov -d target/infra/terraform --quiet --compact -o json > raw/checkov.json || [[ -s raw/checkov.json ]] ;;
            kev)
              python agents/tools/vulndb.py kev raw ;;                    # CISA KEV 全集（已遭實際利用）
            nvd)
              python agents/tools/vulndb.py nvd raw --target target ;;    # 只讀 Repo ① 的快照建圖譜，不執行其中的程式
          esac
      - name: 正規化與遮蔽
        env:
          TOOL: ${{ matrix.tool }}
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          RUN_ID: ${{ github.run_id }}
        run: python agents/tools/scan_normalize.py "$TOOL" raw out/scanners --target-sha "$TARGET_SHA" --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "${{ github.run_id }}-scanner-${{ matrix.tool }}", path: out/, if-no-files-found: ignore }

  daily-intel:
    needs: [orchestrator, a0-assets]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' && needs.a0-assets.result == 'success' && needs.orchestrator.outputs.daily_intel == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scenario == 'daily' && inputs.trigger_source == 'manual')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true            # 失敗不影響後續流程
    permissions:
      contents: read                   # 不安裝 Claude GitHub App；action 使用本 Job 的唯讀 Token
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: "${{ github.run_id }}-a0", path: out/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - name: 程式抓取資安新聞（RSS 與 CISA KEV；Claude 不上網抓網頁）
        env:
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
        run: |
          python agents/tools/news_collect.py --out out/news.json --stack out/stack.json --as-of "$AS_OF"
          sha256sum out/news.json > "$RUNNER_TEMP/news.sha256"
      - name: 檢查訂閱 Token 格式（不印出 Token）
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then echo "::error::未設定 CLAUDE_CODE_OAUTH_TOKEN"; exit 1; fi
          if [[ "$TOKEN" =~ [[:space:]] ]]; then echo "::error::Token 含空白或換行（可能複製時被折行），請重新貼上"; exit 1; fi
          if [[ "$TOKEN" != sk-ant-oat01-* ]]; then echo "::warning::Token 開頭不是 claude setup-token 產生的格式，請確認沒有貼錯"; fi
          echo "Token 格式檢查通過（長度 ${#TOKEN}）"
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "/daily-intel"
          claude_args: |
            --model sonnet
            --max-turns 40
            --tools "Read,Write,Agent,Skill,WebSearch"
            --allowedTools "Read(./out/**),Read(./.claude/**),Edit(./out/**),Agent,WebSearch"
            --disallowedTools "Bash,Edit,NotebookEdit,WebFetch"
            --permission-mode dontAsk
            --strict-mcp-config
            --settings .claude/daily-intel-settings.json
      - name: 每日情資失敗原因（只列錯誤訊息，不列對話內容；公開 Repo 的 log 是公開的）
        if: ${{ failure() && steps.claude.conclusion == 'failure' }}
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: python3 scripts/claude-error-summary.py "$EXEC_FILE"
      - name: 確認已寫出 out/intel-daily.json
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          if [[ -s out/intel-daily.json ]]; then
            events="$(python3 -c 'import json; d = json.load(open("out/intel-daily.json", encoding="utf-8")); print(len(d.get("events", [])))' 2>/dev/null || echo "無法解析")"
            echo "已寫出 out/intel-daily.json（$(wc -c < out/intel-daily.json) bytes，事件 ${events} 件）"
            python3 scripts/claude-error-summary.py --with-result --activity "$EXEC_FILE"   # 每日紀錄：工具呼叫、被擋的網站、Claude 的說明（不含網頁內容）
            exit 0
          fi
          echo "::error::Claude 執行結束但沒有寫出 out/intel-daily.json"
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | head -20
          python3 scripts/claude-error-summary.py --with-result --activity "$EXEC_FILE"
          exit 1
      - name: 確認 Claude 只寫了 out/
        run: |
          changed="$(git status --porcelain -- . ':!out')"
          if [[ -n "$changed" ]]; then echo "::error::out/ 以外的檔案被改動，不採用本次結果"; echo "$changed"; exit 1; fi
          sha256sum -c --quiet "$RUNNER_TEMP/news.sha256" || { echo "::error::out/news.json 在 Claude 執行後被改動，不採用本次結果"; exit 1; }
      - uses: actions/upload-artifact@v4        # 只有上面的檢查通過才上傳；失敗時報告標示「今日新聞情資未更新」
        with:
          name: "${{ github.run_id }}-intel-daily"
          path: |
            out/intel-daily.json
            out/news.json
          if-no-files-found: ignore
      - name: 整理每日情資執行紀錄（給 Agent 執行頁；只含工具名稱與次數）
        if: ${{ !cancelled() }}
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: python3 scripts/claude-error-summary.py --trace out/daily-intel/trace.jsonl "$EXEC_FILE"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "${{ github.run_id }}-daily-intel-trace", path: out/daily-intel/trace.jsonl, if-no-files-found: ignore }

  a1-intel:
    needs: [orchestrator, a0-assets, daily-intel]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' && fromJSON(needs.orchestrator.outputs.plan || '{}').a1 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 每日情資失敗或未執行 → 報告標示「今日新聞情資未更新」
        with: { name: "${{ github.run_id }}-intel-daily", path: out/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: ${{ needs.orchestrator.outputs.execution_mode }}
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          ADVISORY_REVISION: ${{ inputs.advisory_revision }}
          ASSETS: ${{ inputs.assets }}
          TARGET_DIR: target
          ANTHROPIC_API_KEY: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.ANTHROPIC_API_KEY || '' }}
          # live 時先向 /api/budget 預留月預算（SDK 子行程會清除這兩個變數，見 llm.scrubbed_environ）
          NOTIFY_TOKEN: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.NOTIFY_TOKEN || '' }}
          SENTINEL_BASE_URL: ${{ needs.orchestrator.outputs.execution_mode == 'live' && vars.SENTINEL_BASE_URL || '' }}
        run: python agents/run_agent.py a1
      - uses: actions/upload-artifact@v4
        with: { name: "${{ github.run_id }}-a1", path: out/, if-no-files-found: error }

  a2-scan:
    needs: [orchestrator, a0-assets, scanners]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' && fromJSON(needs.orchestrator.outputs.plan || '{}').a2 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 掃描被跳過或失敗時，依 manifest 判斷合法沿用或記為缺失
        with: { pattern: "${{ github.run_id }}-scanner-*", path: dl/, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 缺少時改用離線 fixture 並在報告標示
        with: { name: "${{ github.run_id }}-deployments", path: gh/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: ${{ needs.orchestrator.outputs.execution_mode }}
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          ASSETS: ${{ inputs.assets }}
          TARGET_DIR: target
          SCANNERS_DIR: dl/scanners
          ANTHROPIC_API_KEY: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.ANTHROPIC_API_KEY || '' }}
          # live 時先向 /api/budget 預留月預算（SDK 子行程會清除這兩個變數，見 llm.scrubbed_environ）
          NOTIFY_TOKEN: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.NOTIFY_TOKEN || '' }}
          SENTINEL_BASE_URL: ${{ needs.orchestrator.outputs.execution_mode == 'live' && vars.SENTINEL_BASE_URL || '' }}
        run: python agents/run_agent.py a2
      - uses: actions/upload-artifact@v4
        with: { name: "${{ github.run_id }}-a2", path: out/, if-no-files-found: error }

  a3-signals:
    needs: [orchestrator, a0-assets]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' && fromJSON(needs.orchestrator.outputs.plan || '{}').a3 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 缺少時改用離線 fixture 並在報告標示
        with: { name: "${{ github.run_id }}-deployments", path: gh/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: ${{ needs.orchestrator.outputs.execution_mode }}
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          ASSETS: ${{ inputs.assets }}
          TARGET_DIR: target
          ANTHROPIC_API_KEY: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.ANTHROPIC_API_KEY || '' }}
          # live 時先向 /api/budget 預留月預算（SDK 子行程會清除這兩個變數，見 llm.scrubbed_environ）
          NOTIFY_TOKEN: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.NOTIFY_TOKEN || '' }}
          SENTINEL_BASE_URL: ${{ needs.orchestrator.outputs.execution_mode == 'live' && vars.SENTINEL_BASE_URL || '' }}
        run: python agents/run_agent.py a3
      - uses: actions/upload-artifact@v4
        with: { name: "${{ github.run_id }}-a3", path: out/, if-no-files-found: error }

  a4-risk:
    needs: [orchestrator, a1-intel, a2-scan, a3-signals]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' && fromJSON(needs.orchestrator.outputs.plan || '{}').a4 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "${{ github.run_id }}-a1", path: out/ }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "${{ github.run_id }}-scanner-*", path: dl/, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 缺少時改用離線 fixture 並在報告標示
        with: { name: "${{ github.run_id }}-deployments", path: gh/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: ${{ needs.orchestrator.outputs.execution_mode }}
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          ASSETS: ${{ inputs.assets }}
          TARGET_DIR: target
          SCANNERS_DIR: dl/scanners
          ANTHROPIC_API_KEY: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.ANTHROPIC_API_KEY || '' }}
          # live 時先向 /api/budget 預留月預算（SDK 子行程會清除這兩個變數，見 llm.scrubbed_environ）
          NOTIFY_TOKEN: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.NOTIFY_TOKEN || '' }}
          SENTINEL_BASE_URL: ${{ needs.orchestrator.outputs.execution_mode == 'live' && vars.SENTINEL_BASE_URL || '' }}
        run: python agents/run_agent.py a4
      - uses: actions/upload-artifact@v4
        with: { name: "${{ github.run_id }}-a4", path: out/, if-no-files-found: error }

  claude-analysis:
    needs: [orchestrator, a0-assets, scanners, daily-intel, a1-intel, a2-scan, a3-signals, a4-risk]
    if: ${{ !cancelled() && needs.orchestrator.result == 'success' && needs.a4-risk.result == 'success' && needs.orchestrator.outputs.daily_intel == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scenario == 'daily' && inputs.trigger_source == 'manual')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true            # 失敗時 A5 改用程式範本，報告照常產出
    permissions:
      contents: read                   # 與 daily-intel 相同：不安裝 Claude GitHub App，使用本 Job 的唯讀 Token
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "${{ github.run_id }}-{orchestrator,a0,a1,a2,a3,a4,intel-daily}", path: out/, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "${{ github.run_id }}-scanner-*", path: dl/, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "${{ github.run_id }}-deployments", path: gh/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - name: 程式整理要請 Claude 撰寫的項目（分數、等級與燈號已由程式算好）
        env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: replay             # 這個 Job 不用 API：任務改用範本並記下，由下方 Claude（訂閱方案）撰寫
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          TARGET_DIR: target
          SCANNERS_DIR: dl/scanners
        run: |
          python agents/run_agent.py llm-plan
          sha256sum out/llm/tasks.json > "$RUNNER_TEMP/llm.sha256"
      - name: 檢查訂閱 Token 格式（不印出 Token）
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then echo "::error::未設定 CLAUDE_CODE_OAUTH_TOKEN"; exit 1; fi
          if [[ "$TOKEN" =~ [[:space:]] ]]; then echo "::error::Token 含空白或換行（可能複製時被折行），請重新貼上"; exit 1; fi
          echo "Token 格式檢查通過（長度 ${#TOKEN}）"
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "/analysis-writer"
          claude_args: |
            --model sonnet
            --max-turns 40
            --tools "Read,Write,Skill"
            --allowedTools "Read(./out/**),Read(./.claude/**),Edit(./out/**)"
            --disallowedTools "Bash,Edit,NotebookEdit,WebFetch,WebSearch,Agent"
            --permission-mode dontAsk
            --strict-mcp-config
            --settings .claude/analysis-settings.json
      - name: Claude 撰寫失敗原因（只列錯誤訊息，不列對話內容；公開 Repo 的 log 是公開的）
        if: ${{ failure() && steps.claude.conclusion == 'failure' }}
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: python3 scripts/claude-error-summary.py "$EXEC_FILE"
      - name: 確認已寫出 out/llm/results.json
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          if [[ -s out/llm/results.json ]]; then
            echo "已寫出 out/llm/results.json（$(wc -c < out/llm/results.json) bytes）"
            python3 scripts/claude-error-summary.py --activity "$EXEC_FILE"
            exit 0
          fi
          echo "::error::Claude 執行結束但沒有寫出 out/llm/results.json"
          python3 scripts/claude-error-summary.py --with-result --activity "$EXEC_FILE"
          exit 1
      - name: 確認 Claude 只寫了 out/
        run: |
          changed="$(git status --porcelain -- . ':!out')"
          if [[ -n "$changed" ]]; then echo "::error::out/ 以外的檔案被改動，不採用本次結果"; echo "$changed"; exit 1; fi
          sha256sum -c --quiet "$RUNNER_TEMP/llm.sha256" || { echo "::error::out/llm/tasks.json 在 Claude 執行後被改動，不採用本次結果"; exit 1; }
      - name: 程式驗證 Claude 的結果（範圍、格式、不得改動分數與等級、不得含金鑰）
        env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: replay             # 這個 Job 不用 API：任務改用範本並記下，由下方 Claude（訂閱方案）撰寫
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          TARGET_DIR: target
          SCANNERS_DIR: dl/scanners
        run: python agents/run_agent.py llm-validate
      - uses: actions/upload-artifact@v4        # 只有上面的檢查都通過才上傳；否則 A5 改用程式範本
        with: { name: "${{ github.run_id }}-llm", path: out/llm/validated.json, if-no-files-found: ignore }
      - name: 整理撰寫紀錄（給 Agent 執行頁；只含任務數與工具次數）
        if: ${{ !cancelled() }}
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: python3 scripts/claude-error-summary.py --trace out/claude-analysis/trace.jsonl --job claude-analysis "$EXEC_FILE"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "${{ github.run_id }}-claude-analysis-trace", path: out/claude-analysis/trace.jsonl, if-no-files-found: ignore }

  a5-report:
    needs: [orchestrator, a0-assets, scanners, daily-intel, a1-intel, a2-scan, a3-signals, a4-risk, claude-analysis]
    if: ${{ !cancelled() }}           # Orchestrator 失敗也產出 failures/<run_id> 的降級報告
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_READ_TOKEN }}
          ref: ${{ needs.orchestrator.outputs.target_sha || '' }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "${{ github.run_id }}-{orchestrator,a0,a1,a2,a3,a4,intel-daily}", path: out/, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 每日情資沒執行（網站觸發、情境）時沒有這個 artifact
        with: { name: "${{ github.run_id }}-daily-intel-trace", path: out/daily-intel/ }
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 只有排程與手動 daily 有：Claude（訂閱方案）撰寫且通過驗證的說明文字
        with: { name: "${{ github.run_id }}-llm", path: out/llm/ }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "${{ github.run_id }}-claude-analysis-trace", path: out/claude-analysis/ }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "${{ github.run_id }}-scanner-*", path: dl/, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true            # 缺少時改用離線 fixture 並在報告標示
        with: { name: "${{ github.run_id }}-deployments", path: gh/ }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - name: A5 報告與建議
        env:
          SCENARIO: ${{ inputs.scenario || 'daily' }}
          AS_OF: ${{ needs.orchestrator.outputs.as_of }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EXECUTION_MODE: ${{ needs.orchestrator.outputs.execution_mode || 'replay' }}
          TARGET_SHA: ${{ needs.orchestrator.outputs.target_sha }}
          ADVISORY_ID: ${{ inputs.advisory_id }}
          ADVISORY_REVISION: ${{ inputs.advisory_revision }}
          ASSETS: ${{ inputs.assets }}
          TARGET_DIR: target
          SCANNERS_DIR: dl/scanners
          ANTHROPIC_API_KEY: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.ANTHROPIC_API_KEY || '' }}
          # live 時先向 /api/budget 預留月預算（SDK 子行程會清除這兩個變數，見 llm.scrubbed_environ）
          NOTIFY_TOKEN: ${{ needs.orchestrator.outputs.execution_mode == 'live' && secrets.NOTIFY_TOKEN || '' }}
          SENTINEL_BASE_URL: ${{ needs.orchestrator.outputs.execution_mode == 'live' && vars.SENTINEL_BASE_URL || '' }}
        run: python agents/run_agent.py a5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "${{ github.run_id }}-candidate"
          if-no-files-found: ignore
          path: |
            dashboard/public/data/
            reports/intel/
      - name: 發布（只 stage 允許的路徑）
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_DIR: ${{ needs.orchestrator.outputs.output_dir || format('failures/{0}', github.run_id) }}
        run: scripts/push-with-retry.sh "$OUTPUT_DIR"
      - name: 通知有效燈號（P2；未設定時略過）
        if: ${{ success() && vars.SENTINEL_BASE_URL != '' && needs.orchestrator.outputs.scope != 'scenario' }}
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          BASE_URL: ${{ vars.SENTINEL_BASE_URL }}
          SCOPE: ${{ needs.orchestrator.outputs.scope }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [[ "$BASE_URL" == https://* ]] || { echo "SENTINEL_BASE_URL 必須是 HTTPS"; exit 0; }
          curl -fsS -X POST "$BASE_URL/api/notify/light" -H "authorization: Bearer $NOTIFY_TOKEN" \
            -H "content-type: application/json" -d "{\"scope\":\"$SCOPE\",\"run_id\":\"$RUN_ID\",\"sha\":\"$(git rev-parse HEAD)\"}" \
            || echo "通知失敗（不影響發布）"
