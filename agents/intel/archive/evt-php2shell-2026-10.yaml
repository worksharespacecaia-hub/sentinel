id: evt-php2shell-2026-10
kind: archive
demo: false
title: PHP2Shell：PHP 核心兩個免驗證遠端程式碼執行漏洞（CVE-2026-109618、CVE-2026-109619）
date: '2026-10-21'
industry: null
attack_chain:
- 攻擊者向 PHP 網站伺服器送出特製請求（例如 multipart 請求）
- 觸發記憶體耗盡（OOM）處理時的記憶體損壞，或跨請求的釋放後使用
- 在應用程式驗證邏輯執行前，以 web worker 權限遠端執行任意程式碼
attck:
- T1190
cves:
- CVE-2026-109618
- CVE-2026-109619
revision: 2026-11-09.1
confidence: confirmed
controls: []
products:
- name: php
  ecosystem: php
  affected:
  - {introduced: "8.2.0", fixed: "8.2.35"}
  - {introduced: "8.3.0", fixed: "8.3.36"}
  - {introduced: "8.4.0", fixed: "8.4.27"}
  - {introduced: "8.5.0", fixed: "8.5.12"}
  - {introduced: "8.1.0", fixed: null}
  - {introduced: "8.0.0", fixed: null}
  - {introduced: "7.4.0", fixed: null}
  conditions:
  - {key: serves_web_requests, equals: true, source_ref: 0}
  unknown_below: "7.4.0"   # 來源只列到 7.4；heatalk 指出根因可追溯到 PHP 5.4，更舊版本一律 need_check，不判定安全
  aggravating_conditions:   # 只影響 CVE-2026-109619 的 session 路徑；不是必要條件（關閉它不能解除 CVE-2026-109618）
  - {key: session.upload_progress.enabled, equals: 'On', source_ref: 0, applies_to: CVE-2026-109619}
  cvss: 9.2
  known_exploited: true
  impact: remote_code_execution
  confirmed: true
  source_refs:
  - 0
  - 1
  - 2
facts:
- field: date
  source_ref: 0
  quote: On October 21, 2026, the PHP project announced security releases for two critical vulnerabilities in PHP.
- field: products[0].affected[0]
  source_ref: 0
  quote: 'PHP 8.2 releases before 8.2.35: Update to 8.2.35'
- field: products[0].affected[1]
  source_ref: 0
  quote: 'PHP 8.3 releases before 8.3.36: Update to 8.3.36'
- field: products[0].affected[2]
  source_ref: 0
  quote: 'PHP 8.4 releases before 8.4.27: Update to 8.4.27'
- field: products[0].affected[3]
  source_ref: 0
  quote: 'PHP 8.5 releases before 8.5.12: Update to 8.5.12'
- field: products[0].affected
  source_ref: 2
  quote: PHP 官方於 10 月 21 日發布緊急修補版 8.2.35、8.3.36、8.4.27 與 8.5.12，更舊的分支已終止支援，不會有官方修補。
- field: products[0].affected[4..6]
  source_ref: 0
  quote: PHP 8.1 and older no longer receive routine upstream updates.
- field: products[0].affected[4..6].backports
  source_ref: 0
  quote: For this incident, PHP has supplied limited source backports for PHP 7.4, 8.0, and 8.1.
- field: products[0].affected[4..6]
  source_ref: 1
  quote: PHP官方此次發布的補丁僅覆蓋8.2、8.3、8.4及8.5版本，而PHP 8.1及更早版本早已停止官方支援
- field: products[0].affected.origin
  source_ref: 1
  quote: 漏洞的根源可追溯至2012年發布的PHP 5.4版本
- field: products[0].conditions[0]
  source_ref: 0
  quote: All installations serving web requests are at risk, including PHP-FPM, Apache mod_php, php-cgi, FrankenPHP, and LiteSpeed.
- field: products[0].conditions.sapi
  source_ref: 0
  quote: The vendor considers mod_php the highest risk because exploitation can succeed before any application code runs.
- field: products[0].conditions[1]
  source_ref: 0
  quote: Session upload progress, PHP's upload-tracking feature, is enabled by default and can act as an early consumer of stale session or decoder state before normal initialization
- field: products[0].conditions[1].scope
  source_ref: 0
  quote: This addresses the confirmed session paths only.
- field: products[0].conditions[1].scope
  source_ref: 0
  quote: Note that an update containing both complete fixes is the only complete remediation.
- field: products[0].cvss
  source_ref: 0
  quote: Both have a CVSSv4 score of 9.2
- field: products[0].impact
  source_ref: 0
  quote: both can allow for unauthenticated remote code execution (RCE) with the web worker's privileges
- field: products[0].known_exploited
  source_ref: 0
  quote: On October 26, 2026, CVE-2026-109618 and CVE-2026-109619 were added to the U.S. Cybersecurity and Infrastructure Security Agency's (CISA) list of known exploited vulnerabilities (KEV)
- field: products[0].known_exploited
  source_ref: 2
  quote: watchTowr 已觀察到實際攻擊
- field: products[0].known_exploited.nuance
  source_ref: 0
  quote: Rapid7 has not observed exploitation in the wild, though there are multiple reports of exploitation attempts
- field: timeline.leak
  source_ref: 1
  quote: PHP官方原定10月22日發布修復補丁，但消息在20日便已在網上洩露，迫使官方將發布時間提前至21日。
- field: timeline.exploitation
  source_ref: 1
  quote: 消息發布後45分鐘內，攻擊嘗試增至數萬起；兩小時內增至數十萬起；累計達到數百萬次。
- field: timeline.probing
  source_ref: 1
  quote: 亞馬遜威脅情報更發現，在漏洞公開前4天，已出現秘密探測活動。
- field: attack_chain[0]
  source_ref: 0
  quote: Crafted multipart requests, used for forms and file uploads, can exhaust memory even when their size appears to meet PHP's configured limits.
- field: attack_chain[1]
  source_ref: 1
  quote: 只要向伺服器發送一條特製請求，便可能觸發記憶體耗盡或釋放後使用的缺陷，進而遠端執行任意程式碼，接管整台伺服器
- field: attack_chain[2]
  source_ref: 2
  quote: 兩者都在應用程式驗證邏輯執行之前觸發，所以網站本身有登入保護也擋不住。
- field: impact.exposed_instances
  source_ref: 2
  quote: Unit 42 的 Cortex Xpanse 遙測則找到超過 2,260 萬個可能受影響的對外暴露實例
