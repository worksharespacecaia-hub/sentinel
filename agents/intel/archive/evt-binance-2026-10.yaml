id: evt-binance-2026-10
kind: archive
demo: false
title: 幣安 63.4 億美元駭案：假面試惡意程式入侵開發者電腦，取得容器部署憑證後攻陷錢包簽章服務
date: '2026-10-30'
industry: 加密貨幣
attack_chain:
- 6 月工程師 A 經搜尋引擎下載遭竄改的 Homebrew 安裝檔，團隊角色曝光
- 9 月以假求職面試要求工程師 B 在工作電腦下載並安裝含惡意程式的「作業」
- 惡意程式替換開發工具元件（pyenv）並連線外部伺服器，端點防護未偵測
- 10 月 20 日經 B 的電腦利用內部 AI 工具取得工程師 A、C 電腦的控制權
- 在 A 的電腦上發現具容器部署權限的存取憑證（token）
- 從 C 的電腦以 A 的憑證部署容器並觸發惡意腳本
- 存取內部錢包簽章服務，在正常提款流程外發起交易並濫用 EIP-7702 委託授權
attck:
- T1566.003
- T1204.002
- T1554
- T1552
- T1550.001
- T1610
cves: []
revision: 2026-11-09.1
confidence: confirmed
controls:
- C-DEV-DEVICE-TOKEN
- C-NON-CI-DEPLOY
products: []
facts:
- field: date
  source_ref: 0
  quote: 到了台灣時間10月30日凌晨1時15分至3時56分，駭客登入C的電腦，用A的憑證部署容器並觸發惡意腳本，正式發動攻擊。
- field: attack_chain[0]
  source_ref: 1
  quote: A Wallet DevOps engineer, identified as Engineer A, downloaded a tampered Homebrew installation while trying to install an AI coding tool found through a search engine.
- field: attack_chain[0].uncertainty
  source_ref: 1
  quote: Binance says team roles were exposed; continuous access from June is not established.
- field: attack_chain[1]
  source_ref: 1
  quote: Engineer B was approached through a legitimate recruitment platform.
- field: attack_chain[1]
  source_ref: 0
  quote: 第二輪面試尾聲，對方要求B把一份「作業」下載到工作電腦，裡頭藏著惡意程式碼，一安裝就會執行。
- field: attack_chain[2]
  source_ref: 1
  quote: A malicious pyenv component executes commands and contacts an external server.
- field: attack_chain[2]
  source_ref: 1
  quote: The malware communicated with an attacker-controlled external server and was not detected by the endpoint protection tools in place at the time.
- field: attack_chain[3]
  source_ref: 1
  quote: On October 20, the attacker used B’s compromised computer and an internal AI tool to gain control over the computers of A and another wallet engineer, C.
- field: attack_chain[3].uncertainty
  source_ref: 1
  quote: Binance has not named the internal AI tool or explained how the attacker used it to reach other machines.
- field: attack_chain[4]
  source_ref: 1
  quote: The attacker found a container deployment permission token on A’s computer.
- field: attack_chain[5]
  source_ref: 1
  quote: On October 29, between 17:15 and 19:56 UTC, the attacker accessed C’s computer, used credentials stolen from A, deployed a container, and triggered a malicious script.
- field: controls[C-NON-CI-DEPLOY]
  source_ref: 1
  quote: Binance says the attacker used C’s computer with A’s credentials.
- field: attack_chain[6]
  source_ref: 1
  quote: Binance reports unauthorized access to an internal wallet signing service that initiated transactions outside the normal withdrawal process.
- field: attack_chain[6]
  source_ref: 0
  quote: 攻擊者透過簽章服務送出50筆簽章交易，濫用這套機制建立惡意授權
- field: impact.assets
  source_ref: 1
  quote: Binance now estimates approximately $6.34 billion in impacted assets.
- field: impact.frozen
  source_ref: 1
  quote: Binance reports approximately $2.85 billion frozen or intercepted, subject to reconciliation and market prices.
- field: impact.replenished
  source_ref: 0
  quote: 截至10月31日，98%受影響的代幣資產已補足
- field: attribution
  source_ref: 1
  quote: The FBI has attributed the theft to North Korea’s TraderTraitor activity.
- field: remediation
  source_ref: 0
  quote: 幣安已在新環境重建錢包系統與內部AI工具、更換受影響裝置並註銷相關憑證
sources:
- url: https://www.bnext.com.tw/article/92910/binance-hack-initial-findings-north-korea
  title: 幣安63.4億美元資安案調查出爐：北韓駭客如何用「假面試、內部AI」層層攻陷錢包？|數位時代 BusinessNext
  quote: 攻擊者從6月起布局，先用遭竄改的開發工具安裝檔、假求職面試植入惡意程式，再以內部AI工具為跳板，一路取得錢包簽章服務的存取權。
