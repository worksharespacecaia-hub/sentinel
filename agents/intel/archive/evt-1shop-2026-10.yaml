id: evt-1shop-2026-10
kind: archive
demo: false
title: 1shop 一頁購物疑 Mailgun API 金鑰遭取得，詐騙信內容吻合真實訂單
date: '2026-10-28'
industry: 電商
attack_chain:
- 疑似取得 1shop 寄送訂單通知信所用的 Mailgun API 金鑰（業者懷疑，尚待存取紀錄釐清）
- 讀取「訂單成立通知信」內容
- 冒用真實訂單資訊寄送「定期購／分 12 期扣款」詐騙信
- 誘導消費者加入假冒的 LINE 客服或點擊連結
attck: []
cves: []
revision: 2026-11-09.1
confidence: provisional
controls:
- C-THIRD-PARTY-KEY-ROTATION
products: []
facts:
- field: date
  source_ref: 0
  quote: 指出10月28日晚間接獲商家及消費者通報，有人冒用訂單資訊寄送詐騙郵件
- field: timeline.announced
  source_ref: 0
  quote: 電商開店服務業者1shop於10月30日發布公告
- field: attack_chain[0]
  source_ref: 0
  quote: 1shop懷疑原有的第三方郵件服務Mailgun API金鑰可能遭他人取得，進而讀取訂單通知信內容
- field: attack_chain[1]
  source_ref: 0
  quote: 初步研判不法人士可能取得「訂單成立通知信」內容
- field: attack_chain[2]
  source_ref: 0
  quote: 聲稱消費者已訂閱定期購服務，將分12期扣款
- field: attack_chain[3]
  source_ref: 0
  quote: 並誘導加入假冒的LINE客服或點擊連結取消訂閱
- field: evidence.order_match
  source_ref: 1
  quote: 比對後發現信中的姓名、品項、金額與顧客訂單大致吻合，信中的收件地址則是假的
- field: evidence.timestamp
  source_ref: 0
  quote: 信中標示的「首次訂購日期」，並非實際訂單成立時間，而是晚了幾秒的訂單通知信寄送時間
- field: controls[C-THIRD-PARTY-KEY-ROTATION]
  source_ref: 1
  quote: 當晚立即替換掉原本用來發送訂單通知信的 Mailgun 金鑰
- field: remediation
  source_ref: 0
  quote: 業者也已更換金鑰，將原本保存7天的通知信內容改為不再保存
- field: confidence
  source_ref: 0
  quote: 目前已向Mailgun申請相關存取紀錄，以釐清實際原因
